[platformio]
default_envs = uno

[env:uno]
platform = atmelavr
board = uno
framework = arduino
build_src_filter =
    +<*>
    -<esp32_bridge.cpp>
build_flags =
    -Wall
    -Wextra
lib_deps =
    adafruit/DHT sensor library@1.4.7
    adafruit/Adafruit Unified Sensor@1.1.15
    adafruit/Adafruit MPU6050@2.2.9
    teckel12/NewPing@1.9.7

[env:esp32_bridge]
platform = espressif32@7.0.1
board = esp32dev
framework = arduino
build_src_filter =
    -<*>
    +<esp32_bridge.cpp>
build_flags =
    -Wall
    -Wextra
